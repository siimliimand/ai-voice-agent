name: ai-voice-agent

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      # All runtime configuration comes from .env (see .env.example).
      - DATABASE_URL=postgres://voice:voice@postgres:5432/voice
    env_file:
      # Optional: all runtime configuration comes from .env when present
      # (see .env.example); the service also runs without it.
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    # Apply migrations, then start the server.
    command: sh -c "node dist/db/migrate-cli.js && node dist/server.js"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: voice
      POSTGRES_PASSWORD: voice
      POSTGRES_DB: voice
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice -d voice"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
